name: Correctness and measured smoke
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5, Node.js 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6, Node.js 24
        with:
          python-version: '3.12'
      - name: Install fixed direct dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-real-model.txt
      - name: Production CLI, actual ORT, independent references and deliberate faults
        run: python -m unittest discover -s tests -v
      - name: Optimized Python must preserve validation
        run: python -O -m unittest discover -s tests
      - name: Report provenance and repository publication hygiene
        run: |
          python tools/check_project.py
          python tools/check_digits.py
      - name: Actual source mutations must fail behavioral assertions
        run: python tools/run_mutations.py --real-model
      - name: Actual inference timing smoke, not a performance gate
        run: python tools/measure_suite.py --iterations 10 --repeats 1
      - name: Complete held-out dataset timing smoke, not a performance gate
        run: python tools/measure_digits.py --output results/local/digits-ci --batches 16 --iterations 1 --repeats 1
