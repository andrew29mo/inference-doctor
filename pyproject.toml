[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-doctor"
version = "0.2.0"
description = "Evidence-based ONNX inference deployment diagnostics"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "onnx==1.23.2", "onnxruntime==1.31.0", "psutil==7.2.2"]

[project.scripts]
inference-doctor = "inference_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
